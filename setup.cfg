[metadata]
name = card-capture
version = 0.1.0
description = Extract high-quality sports card stills from local video files.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy
    opencv-python

[options.packages.find]
where = src

[options.extras_require]
pipeline_v21 =
    av
    onnxruntime
model =
    huggingface-hub
    ultralytics
review =
    fastapi
    jinja2
    python-multipart
    uvicorn
test =
    pytest
    httpx

[options.entry_points]
console_scripts =
    card-capture = card_capture.cli:main
