name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y ffmpeg libsm6 libxext6
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install regular requirements and test requirements. Assuming pip install -e .[test] works or requirements.txt
        # If pyproject.toml is used:
        pip install .
        pip install pytest pytest-asyncio httpx pydantic anyio
    - name: Test with pytest
      run: |
        pytest tests/ -q
        pytest tests/architecture/ -q
    - name: Validate schema docs drift
      run: |
        python scripts/validate_schema_docs.py

