name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CC_ALLOW_CPU_FALLBACK: "1"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,app,harness,legacy_tracking,model,review]"

    - name: Validate schema docs drift
      run: |
        python scripts/validate_schema_docs.py

    - name: Default test suite
      run: |
        pytest tests/ -q

    - name: Architecture lane (Import Linter + AST scanners)
      run: |
        pytest tests/architecture/ -q

    - name: Performance harness smoke
      run: |
        pytest tests/performance/test_perf_harness_smoke.py -q

    - name: Import Linter (blocking)
      env:
        PYTHONPATH: src:.
      run: |
        # Use the installed entry point or fall back to module execution
        python -m importlinter.cli lint || lint-imports
