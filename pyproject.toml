[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-capture"
version = "0.1.0"
description = "Extract high-quality sports card stills from local video files."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "opencv-python",
  "Pillow>=10.4.0",
  "supervision>=0.21,<0.28",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "boto3>=1.34.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "imagehash>=4.3",
]

[project.optional-dependencies]
pipeline_v21 = [
  "av",
  "onnxruntime",
  "boxmot>=0.14.0",
]
model = [
  "huggingface-hub",
  "ultralytics",
  "coremltools",
]
review = [
  "fastapi",
  "jinja2",
  "python-multipart",
  "uvicorn",
]
app = [
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic>=2",
  "httpx",
  "python-multipart",
]
test = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "fastapi",
  "pydantic>=2",
  "anyio",
  "python-multipart",
]
harness = [
  "pydantic>=2",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
]
dev = [
  "import-linter>=2.0",
  "pytest>=7.0",
]

[project.scripts]
card-capture = "card_capture.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
  "quarantine: known-broken test, must reference an issue and disposition; excluded from default CI lane",
  "mps: requires Apple Silicon MPS",
  "benchmark: real-video performance benchmark",
  "slow: takes >5s; excluded from fast PR lane",
]
addopts = "-m 'not quarantine and not benchmark'"

[tool.gpu_strict_lint]
files = [
  "src/card_capture/runtime/strict_gpu.py",
  "src/card_capture/runtime/gpu_session.py",
  "src/card_capture/runtime/guards.py",
  # batches.py is the EXPORT BOUNDARY itself; intentionally NOT in scope.
]
forbidden_calls = [
  "cv2.VideoCapture",
  "cv2.imread",
  "cv2.imwrite",            # exception: card_capture.runtime.batches.to_cpu_for_export
  "PIL.Image.open",
  "torch.Tensor.cpu",
  "torch.Tensor.numpy",
]
allowed_export_helpers = [
  "card_capture.runtime.batches.to_cpu_for_score",
  "card_capture.runtime.batches.to_cpu_for_phash",
  "card_capture.runtime.batches.to_cpu_for_export",
  "card_capture.runtime.batches.to_cpu_for_fuse",
  "card_capture.runtime.batches.to_cpu_for_dedup",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
card_capture = ["templates/*.html"]
