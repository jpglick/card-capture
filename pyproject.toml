[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-capture"
version = "0.1.0"
description = "Extract high-quality sports card stills from local video files."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "opencv-python",
  "supervision>=0.21,<0.28",
  "torchvision",
]

[project.optional-dependencies]
pipeline_v21 = [
  "av",
  "onnxruntime",
  "boxmot>=0.14.0",
]
model = [
  "huggingface-hub",
  "ultralytics",
]
review = [
  "fastapi",
  "jinja2",
  "python-multipart",
  "uvicorn",
]
app = [
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic>=2",
  "httpx",
]
test = [
  "pytest",
  "httpx",
]
harness = [
  "pydantic>=2",
]

[project.scripts]
card-capture = "card_capture.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
card_capture = ["templates/*.html"]
