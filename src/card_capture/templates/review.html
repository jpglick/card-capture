<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Card Capture Review</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f7f7f4; color: #1d1d1b; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      nav a { margin-right: 12px; color: #245; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 20px; }
      article { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
      img { width: 100%; height: auto; display: block; background: #eee; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; font-size: 14px; }
      dt { font-weight: 700; }
      form { display: flex; gap: 8px; margin-top: 10px; }
      input[type="text"] { min-width: 0; flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1>Card Capture Review</h1>
      <nav>
        <a href="/?state=pending">Pending</a>
        <a href="/?state=accepted">Accepted</a>
        <a href="/?state=rejected">Rejected</a>
        <a href="/?state=all">All</a>
      </nav>
    </header>
    <main class="grid">
      {% for card in cards %}
      <article>
        <img src="/images/{{ card.id }}" alt="Detected card crop">
        <dl>
          <dt>Score</dt><dd>{{ "%.3f"|format(card.final_score) }}</dd>
          <dt>State</dt><dd>{{ card.review_state }}</dd>
          <dt>Video</dt><dd>{{ card.source_path }}</dd>
          <dt>Time</dt><dd>{{ card.timestamp_ms }} ms</dd>
        </dl>
        <form method="post" action="/cards/{{ card.id }}/decision">
          <input type="text" name="notes" placeholder="Notes">
          <button name="decision" value="accepted">Accept</button>
          <button name="decision" value="rejected">Reject</button>
        </form>
      </article>
      {% else %}
      <p>No cards match this filter.</p>
      {% endfor %}
    </main>
  </body>
</html>
